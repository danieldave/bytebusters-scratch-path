<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game player</title>
<style>html,body{margin:0;background:#0d0e10;color:#f7f8f8;font:16px/1.5 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100%}
#w{max-width:480px;margin:0 auto}canvas{width:100%;aspect-ratio:4/3;display:block;background:#fff;touch-action:none}
.b{display:flex;gap:8px;padding:8px}button{flex:1;min-height:48px;font:inherit;font-weight:650;padding:12px;border:0;border-radius:12px;background:#ffb800;color:#1a1205;cursor:pointer;transition:transform .12s}button:active{transform:scale(.98)}button.s{background:#16171a;color:#f7f8f8;border:1px solid rgba(255,255,255,.14)}
button:focus-visible{outline:2px solid #3ccf7f;outline-offset:2px}
#m{padding:0 10px 10px;color:#a0a5ad;font-size:14px}canvas{border-radius:10px}@media (prefers-reduced-motion:reduce){button{transition:none}}</style></head>
<body><div id="w"><canvas id="c" width="480" height="360"></canvas>
<div class="b"><button id="f">▶ Start</button><button id="x" class="s">■ Stop</button></div><div id="m">Loading the game player…</div></div>
<script>
(function(){
var q=new URLSearchParams(location.search),file=(q.get('f')||'').replace(/[^a-z0-9\-\.]/g,''),m=document.getElementById('m');
function load(src){return new Promise(function(ok,no){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=function(){no(new Error('load '+src))};document.head.appendChild(s)})}
if(!/\.sb3$/.test(file)){m.textContent='No game chosen.';return}
Promise.all(['scratch-vm','scratch-render','scratch-svg-renderer','scratch-storage'].map(function(n){return null})).then(function(){
 return load('/vendor/scratch-render.min.js')}).then(function(){return load('/vendor/scratch-svg-renderer.min.js')}).then(function(){return load('/vendor/scratch-storage.min.js')}).then(function(){return load('/vendor/scratch-vm.min.js')})
.then(function(){return fetch('/files/'+file)}).then(function(r){if(!r.ok)throw new Error('file');return r.arrayBuffer()}).then(function(buf){
 var canvas=document.getElementById('c'),VM=window.VirtualMachine,vm=new VM(),R=new window.ScratchRender(canvas);
 vm.attachRenderer(R);vm.attachV2SVGAdapter(new window.ScratchSVGRenderer.SVGRenderer());vm.attachV2BitmapAdapter(new window.ScratchSVGRenderer.BitmapAdapter());
 var SS=window.ScratchStorage;SS=(typeof SS==='function')?SS:(SS&&(SS.ScratchStorage||SS.default));vm.attachStorage(new SS());
 vm.setCompatibilityMode(true);vm.start();
 return vm.loadProject(buf).then(function(){
  m.textContent='Tap ▶ Start, then tap the buttons in the game.';
  var running=false;
  document.getElementById('f').onclick=function(){vm.greenFlag()};
  document.getElementById('x').onclick=function(){vm.stopAll()};
  function pos(e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*480/r.width,y:(e.clientY-r.top)*360/r.height}}
  function md(e,down){var p=pos(e);vm.postIOData('mouse',{x:p.x,y:p.y,canvasWidth:480,canvasHeight:360,isDown:down})}
  canvas.addEventListener('pointerdown',function(e){md(e,true)});canvas.addEventListener('pointermove',function(e){md(e,e.buttons>0)});
  window.addEventListener('pointerup',function(e){md(e,false)});
  window.__vm=vm;window.__ready=true;
 })}).catch(function(e){m.textContent='Could not load the game. Check your data and try again.';console.error(e)});
})();
</script></body></html>
