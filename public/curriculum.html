<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4-Year Curriculum Map · ByteBusters</title>
<meta name="description" content="The ByteBusters 4-year coding curriculum: Scratch, HTML & CSS, JavaScript, PHP, Python, Java and capstone projects — and where each term lives in the ByteBusters Studio.">
<link rel="stylesheet" href="style.css"><link rel="icon" href="/icon.svg"><meta name="theme-color" content="#1d2433">
<style>
.yr{margin:22px 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.yr h2{margin:0}
.terms{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:820px){.terms{grid-template-columns:1fr}}
.tm{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;border-top:6px solid var(--line)}
.tm.built{border-top-color:var(--green)}.tm.next{border-top-color:var(--brand)}.tm.planned{border-top-color:var(--line)}
.tm h3{margin:.1em 0 .4em;font-size:1.05em}.k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.u{border-top:1px solid var(--line);padding:7px 0;font-size:.92em}.u b{display:block}.u small{color:var(--mut)}
.st{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;color:#fff}
.st.built{background:var(--green)}.st.next{background:#c98a00}.st.planned{background:#8a8f9c}
.note{font-size:.85em;color:var(--mut);margin-top:6px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
@media print{.bar{display:none}.tm{break-inside:avoid}}
</style></head><body>
<div class="bar"><a href="/" style="color:inherit;text-decoration:none">← Home</a><b>🗺 Curriculum Map</b><a href="#" onclick="print();return false" style="color:inherit">Print</a></div>
<div class="wrap">
<h1>ByteBusters 4-Year Curriculum</h1>
<p class="why">Every term of the official curriculum, and where it lives in the Studio. Three terms a year, ten weeks a term.</p>
<div class="legend"><span class="st built">Built — in the Studio</span><span class="st next">Next to build</span><span class="st planned">Planned</span></div>
<div id="m"><p>Loading…</p></div>
</div>
<script>
(function(){
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var TN=['First Term','Second Term','Third Term'],SL={built:'Built',next:'Next to build',planned:'Planned'};
fetch('/data/curriculum.json').then(function(r){return r.json()}).then(function(d){
 var h='';
 d.years.forEach(function(Y){var b=Y.terms.filter(function(t){return t.status==='built'}).length;
  h+='<div class="yr"><h2>Year '+Y.year+'</h2><span class="why">'+esc(Y.level)+' · '+b+' of 3 terms built</span></div><div class="terms">';
  Y.terms.forEach(function(T,i){
   h+='<div class="tm '+T.status+'"><div class="k">'+TN[i]+'</div><h3>'+esc(T.name)+'</h3><span class="st '+T.status+'">'+SL[T.status]+'</span>'+
   T.units.map(function(u){return '<div class="u"><b>Weeks '+esc(u.weeks)+' · '+esc(u.title)+'</b>'+esc(u.content)+(u.project&&u.project!=='—'?'<br><small>Project: '+esc(u.project)+'</small>':'')+'</div>'}).join('')+
   (T.note?'<div class="note">ℹ️ '+esc(T.note)+'</div>':'')+(T.link?'<p style="margin:8px 0 0"><a class="btn alt" href="'+esc(T.link)+'">Open →</a></p>':'')+'</div>';
  });
  h+='</div>';
 });
 h+='<div class="yr"><h2>Alongside the curriculum</h2></div><div class="terms">'+d.extra.map(function(x){return '<div class="tm built"><h3>'+esc(x.name)+'</h3><div class="note">'+esc(x.note)+'</div><p style="margin:8px 0 0"><a class="btn alt" href="'+esc(x.link)+'">Open →</a></p></div>'}).join('')+'</div>';
 h+='<p class="why" style="margin-top:20px">Source: '+esc(d.source)+'.</p>';
 document.getElementById('m').innerHTML=h;
}).catch(function(){document.getElementById('m').innerHTML='<p>Could not load.</p>'});
})();
</script>
</body></html>
