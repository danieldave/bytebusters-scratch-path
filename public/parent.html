<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progress · ByteBusters</title><meta name="robots" content="noindex"><link rel="stylesheet" href="/ds/ds.css"><link rel="stylesheet" href="/style.css"><meta name="theme-color" content="#08090a" media="(prefers-color-scheme: dark)"><meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)"><link rel="icon" href="/icon.svg"></head>
<body><div class="bar"><b>ByteBusters · Progress</b><span class="o-badge"><span class="d" style="color:var(--green)"></span>Private link</span></div><main class="wrap" id="a" aria-busy="true"><div class="o-skel" style="height:34px;width:70%;margin:26px 0 10px"></div><div class="o-skel" style="height:18px;width:40%;margin-bottom:18px"></div><div class="o-skel" style="height:140px;margin:12px 0"></div><div class="o-skel" style="height:80px;margin:12px 0"></div></main>
<script>
(function(){var t=new URLSearchParams(location.search).get('t')||'',a=document.getElementById('a');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var S={MHS:'Methodist High School Arigbajo',UHS:'Unity High School',YWS:'Yewa College Ilaro'},BN={web:'Web Builder',js:'JS Maker',php:'PHP Starter',blue:'Variable Builder',red:'If Master',green:'Loop Legend',purple:'Event Hero',builder:'Builder'};
fetch('/api/parent?t='+encodeURIComponent(t)).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error);return j})}).then(function(j){
 var n=0,g='';for(var w=1;w<=10;w++){var d=j.weeks['w'+w]&&j.weeks['w'+w].done;if(d)n++;g+='<span class="week-dot'+(d?' on':'')+'">'+w+'</span>'}
 var extra='';[['t2','Term 2: HTML & CSS'],['t3','Term 3: JavaScript & PHP']].forEach(function(T){var c=0,labs=0,any=false,gg='';for(var w=1;w<=10;w++){var o=j.weeks[T[0]+'w'+w];if(o)any=true;if(o&&o.done)c++;if(o&&o.lab)labs++;gg+='<span class="week-dot'+(o&&o.done?' on':'')+'">'+w+'</span>'}if(any)extra+='<div class="card"><b>'+T[1]+'</b>: '+c+' of 10 weeks done, '+labs+' code labs complete<div style="margin-top:8px">'+gg+'</div></div>'});
 var last=j.last?new Date(j.last).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'not started yet';
 a.removeAttribute('aria-busy');a.innerHTML='<div class="hello o-glow o-in"><span class="o-eyebrow">'+esc(S[j.school]||'ByteBusters')+'</span><h1>'+esc(j.first)+'’s Scratch progress</h1><p style="color:var(--mut);margin:0">Shared by '+esc(j.first)+' from ByteBusters Coding Centre.</p></div><div class="card"><b>'+n+' of 10 weeks done</b><div class="prog" style="margin:8px 0"><i style="width:'+n*10+'%"></i></div><div>'+g+'</div><p class="why">Last activity: '+last+'</p></div>'+extra+'<div class="card"><b>Badges</b><p>'+(j.badges.length?j.badges.map(function(b){return '<span class="badge on">'+(BN[b]||b)+'</span>'}).join(''):'<span class="why">None yet. They are earned by building real scripts.</span>')+'</p></div><div class="card"><b>How you can help</b><p>Ask '+esc(j.first)+' to show you the game they are building and explain what the blue, red, green and purple blocks do.</p></div><p class="why">This page shows only first name and progress. It has no ID or password.</p>';
}).catch(function(e){a.removeAttribute('aria-busy');a.innerHTML='<div class="card" style="margin-top:28px;text-align:center"><div style="font-size:40px">🔗</div><h2 style="margin-top:6px">This page could not open</h2><p class="err">'+esc(e.message||'Could not load.')+'</p><p class="why">Ask your child to send the link again from their ByteBusters home page.</p></div>'});})();
</script><style>.week-dot{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--bg-2);border:1px solid var(--line);color:var(--muted);margin:0 4px 4px 0;font-weight:650;font-size:14px;font-variant-numeric:tabular-nums}.week-dot.on{background:var(--bb-green);border-color:transparent;color:#fff}.badge{display:inline-flex;border:1px solid color-mix(in srgb,var(--brand) 70%,transparent);background:var(--warm-soft);border-radius:99px;padding:3px 12px;margin:0 4px 4px 0;font-size:13px;font-weight:650;opacity:1;filter:none}</style></body></html>
