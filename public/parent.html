<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progress · ByteBusters</title><meta name="robots" content="noindex"><link rel="stylesheet" href="/style.css"></head>
<body><div class="bar"><b>ByteBusters · Scratch Path</b></div><div class="wrap" id="a"><p>Loading…</p></div>
<script>
(function(){var t=new URLSearchParams(location.search).get('t')||'',a=document.getElementById('a');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var S={MHS:'Methodist High School Arigbajo',UHS:'Unity High School',YWS:'Yewa College Ilaro'},BN={web:'Web Builder',js:'JS Maker',php:'PHP Starter',blue:'Variable Builder',red:'If Master',green:'Loop Legend',purple:'Event Hero',builder:'Builder'};
fetch('/api/parent?t='+encodeURIComponent(t)).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error);return j})}).then(function(j){
 var n=0,g='';for(var w=1;w<=10;w++){var d=j.weeks['w'+w]&&j.weeks['w'+w].done;if(d)n++;g+='<span class="week-dot'+(d?' on':'')+'">'+w+'</span>'}
 var extra='';[['t2','Term 2: HTML & CSS'],['t3','Term 3: JavaScript & PHP']].forEach(function(T){var c=0,labs=0,any=false,gg='';for(var w=1;w<=10;w++){var o=j.weeks[T[0]+'w'+w];if(o)any=true;if(o&&o.done)c++;if(o&&o.lab)labs++;gg+='<span class="week-dot'+(o&&o.done?' on':'')+'">'+w+'</span>'}if(any)extra+='<div class="card"><b>'+T[1]+'</b>: '+c+' of 10 weeks done, '+labs+' code labs complete<div style="margin-top:8px">'+gg+'</div></div>'});
 var last=j.last?new Date(j.last).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'not started yet';
 a.innerHTML='<h1>'+esc(j.first)+'’s Scratch progress</h1><p style="color:var(--mut)">'+esc(S[j.school]||'')+'</p><div class="card"><b>'+n+' of 10 weeks done</b><div class="prog" style="margin:8px 0"><i style="width:'+n*10+'%"></i></div><div>'+g+'</div><p class="why">Last activity: '+last+'</p></div>'+extra+'<div class="card"><b>Badges</b><p>'+(j.badges.length?j.badges.map(function(b){return '<span class="badge on">'+(BN[b]||b)+'</span>'}).join(''):'<span class="why">None yet. They are earned by building real scripts.</span>')+'</p></div><div class="card"><b>How you can help</b><p>Ask '+esc(j.first)+' to show you the game they are building and explain what the blue, red, green and purple blocks do.</p></div><p class="why">This page shows only first name and progress. It has no ID or password.</p>';
}).catch(function(e){a.innerHTML='<p class="err">'+esc(e.message||'Could not load.')+'</p>'});})();
</script><style>.week-dot{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--line);margin:0 4px 4px 0;font-weight:700;font-size:14px}.week-dot.on{background:var(--green);color:#fff}.badge{display:inline-block;border:2px solid var(--brand);border-radius:99px;padding:2px 10px;margin:0 4px 4px 0;font-size:13px;font-weight:700}</style></body></html>
