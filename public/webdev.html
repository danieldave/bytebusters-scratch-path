<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Year 2 Web Development · ByteBusters</title>
<meta name="description" content="A 10-week Web Development track for young builders: HTML, CSS and JavaScript, learnt through real Nigerian websites built by ByteBusters students.">
<link rel="stylesheet" href="style.css"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1d2433"><link rel="icon" href="/icon.svg">
<style>
.wk{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;cursor:pointer}
.wk .n{flex:none;width:44px;height:44px;border-radius:12px;background:var(--brand);color:#1d2433;font-weight:800;display:grid;place-items:center;font-size:20px}
.wk.done .n{background:var(--green);color:#fff}.wk.lock{opacity:.45;cursor:default}.wk.lock .n{background:var(--line)}
.wk small{color:var(--mut);display:block}
.part{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
pre.code{background:#1d2433;color:#f3efe4;padding:12px;border-radius:12px;overflow:auto;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.sec{border-left:5px solid var(--brand);padding-left:12px;margin:14px 0}
.sec.r{border-color:var(--purple)}.sec.b{border-color:var(--blue)}.sec.c{border-color:var(--green)}
.sec h3{margin:.2em 0}
.ex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style></head>
<body>
<div class="bar"><a href="/" style="color:inherit;text-decoration:none">← Home</a><b>💻 Web Development</b><span id="who"></span></div>
<div class="wrap" id="app"><p>Loading…</p></div>
<div class="toast" id="toast"></div>
<script src="webdev.js"></script>
</body></html>
